name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
  # Also run by release.yml, which publishes the build as a GitHub Release.
  workflow_call:
    inputs:
      sign:
        description: Sign with the permanent release key (release.yml only)
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK and unit tests
    runs-on: ubuntu-latest
    # The signing key and client IDs are secrets of the "release" environment, which only
    # v* tags may use. Pushes and pull requests run without an environment and see none of them.
    environment: ${{ inputs.sign && 'release' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The default also asks for the removed "tools" package, which fails.
          packages: platform-tools
      - name: Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      # The permanent release key, only for release.yml on a v* tag. A release must never fall
      # back to the debug key: that APK can't update an install and Google sign-in fails.
      - name: Release signing key
        if: inputs.sign
        env:
          KEYSTORE_BASE64: ${{ secrets.MELDO_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MELDO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MELDO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MELDO_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::The release environment has no signing key."; exit 1; fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p ~/.gradle
          {
            echo "MELDO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "MELDO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MELDO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "MELDO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties
      - run: ./gradlew --console=plain testDebugUnitTest assembleRelease
        env:
          # OAuth client IDs are not in the repo; empty builds an app without Drive/Teams.
          ORG_GRADLE_PROJECT_MELDO_GOOGLE_CLIENT_ID: ${{ inputs.sign && secrets.MELDO_GOOGLE_CLIENT_ID_ANDROID || '' }}
          ORG_GRADLE_PROJECT_MELDO_TEAMS_CLIENT_ID: ${{ inputs.sign && secrets.MELDO_TEAMS_CLIENT_ID || '' }}
      # Google sign-in only accepts the certificate registered for the app.
      - name: Check the release certificate
        if: inputs.sign
        run: |
          certs=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk)
          echo "$certs" | grep 'SHA-256 digest\|SHA-1 digest'
          echo "$certs" | grep -q 'SHA-1 digest: cbdc2c6f6e94ad89550e4f4367c69f3d92a765df$' \
            || { echo "::error::The APK is not signed with the release key."; exit 1; }
      - name: Remove the signing key
        if: always() && inputs.sign
        run: rm -f "$RUNNER_TEMP/release.jks" ~/.gradle/gradle.properties
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meldo-android-apk
          path: app/build/outputs/apk/release/*.apk
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-results
          # Every module's reports (app, core-android/*, feature/*, integration/*, surfaces).
          path: "**/build/reports/tests/"
