name: Release

# Builds the signed Android APK with the regular build workflow (including its tests)
# and publishes it as a GitHub pre-release. Android users install it from there.
#   git tag v0.9.0 && git push origin v0.9.0
# or run it from the Actions tab with a tag name.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.9.0 (created on the selected branch if missing)"
        required: true

permissions:
  contents: read

jobs:
  android:
    uses: ./.github/workflows/android.yml
    with:
      # The permanent key only for main and v* tags: a release started from another branch
      # builds with the debug key, so branch code never runs next to the release key.
      sign: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      MELDO_RELEASE_KEYSTORE_BASE64: ${{ secrets.MELDO_RELEASE_KEYSTORE_BASE64 }}
      MELDO_RELEASE_STORE_PASSWORD: ${{ secrets.MELDO_RELEASE_STORE_PASSWORD }}
      MELDO_RELEASE_KEY_ALIAS: ${{ secrets.MELDO_RELEASE_KEY_ALIAS }}
      MELDO_RELEASE_KEY_PASSWORD: ${{ secrets.MELDO_RELEASE_KEY_PASSWORD }}
      MELDO_GOOGLE_CLIENT_ID_ANDROID: ${{ secrets.MELDO_GOOGLE_CLIENT_ID_ANDROID }}
      MELDO_TEAMS_CLIENT_ID: ${{ secrets.MELDO_TEAMS_CLIENT_ID }}

  publish:
    name: Publish GitHub Release
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: meldo-android-apk
          path: dist/android
      - name: Name the files after the release
        run: |
          mkdir -p release
          cp dist/android/*.apk "release/Meldo-$TAG.apk"
          ls -l release

      - name: Create the release
        run: |
          notes=$(cat <<'NOTES'
          Install `Meldo-*.apk` directly on Android 8 or newer. Allow installs from unknown sources if asked.
          NOTES
          )
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Meldo $TAG for Android" \
            --prerelease \
            --notes "$notes" \
            --generate-notes
