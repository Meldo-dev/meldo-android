name: Release

# Builds the APK signed with the permanent release key (with the regular build workflow and
# its tests) and publishes it as a GitHub pre-release. Android users install it from there.
#   git tag v0.9.0 && git push origin v0.9.0
# The release notes come from .github/release-notes/<tag>.md when that file exists; the
# workflow puts the APK's SHA-256 in place of {{APK_SHA256}}.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  on-branch:
    # A tag can point at any commit, so check that the release comes from a branch that went
    # through review before the release key or a published build gets involved.
    name: Release commit is on main, beta or alpha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse commits that are on no release branch
        run: |
          for branch in main beta alpha; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch" 2>/dev/null; then
              echo "$GITHUB_SHA is on $branch."
              exit 0
            fi
          done
          echo "::error::$GITHUB_SHA is not on main, beta or alpha. Merge it first, then tag."
          exit 1

  android:
    needs: [on-branch]
    uses: ./.github/workflows/android.yml
    with:
      sign: true
    # The called job only sees the "release" environment's secrets with inherit. The repo
    # itself has no secrets, so this hands over nothing else.
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: meldo-android-apk
          path: dist/android
      - name: Name the APK after the version
        run: |
          mkdir -p release
          cp dist/android/*.apk "release/Meldo-${TAG#v}.apk"
          ls -l release

      - name: Write the release notes
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then
            notes=default.md
            printf '%s\n\n%s\n' "Install the APK on Android 8 or newer. Allow installs from unknown sources if asked." \
              'SHA-256: `{{APK_SHA256}}`' > "$notes"
          fi
          sha=$(sha256sum "release/Meldo-${TAG#v}.apk" | cut -d' ' -f1)
          sed "s/{{APK_SHA256}}/$sha/g" "$notes" > notes.md
          grep -q "$sha" notes.md || { echo "::error::$notes has no {{APK_SHA256}}."; exit 1; }

      - name: Create the release
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Meldo ${TAG#v} (alpha)" \
            --prerelease \
            --notes-file notes.md
